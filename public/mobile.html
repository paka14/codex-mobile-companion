<script>
'use strict';
const $=id=>document.getElementById(id),privateAccess=document.documentElement.dataset.mobileAuth==='tailscale';
function setThemePickerOpen(open,restoreFocus=false){
 const trigger=$('themeToggle');
 $('themePopover').hidden=!open;
 trigger.setAttribute('aria-expanded',String(open));
 if(restoreFocus)trigger.focus({preventScroll:true});
}
function initMobileTheme(){
 const root=document.documentElement,bar=$('themeBar'),trigger=$('themeToggle'),popover=$('themePopover'),choices=[...bar.querySelectorAll('.theme-choice')];
 function apply(choice){
  for(const option of choices)option.setAttribute('aria-pressed',String(option===choice));
  root.dataset.theme=choice.value;
  const name=choice.getAttribute('aria-label');
  $('themeName').textContent=name;
  trigger.title='切换主题：'+name;
  trigger.setAttribute('aria-label',trigger.title);
  for(const property of ['--swatch-bg','--swatch-accent'])trigger.style.setProperty(property,choice.style.getPropertyValue(property));
  if(root.hasAttribute('data-installed-app')){
   const color=getComputedStyle(document.querySelector('header')).backgroundColor;
   if(color&&color!=='transparent'&&color!=='rgba(0, 0, 0, 0)'){
    let meta=document.querySelector('meta[name="theme-color"]');
    if(!meta){meta=document.createElement('meta');meta.name='theme-color';document.head.append(meta)}
    meta.content=color;
   }
  }
  try{localStorage.setItem('codex-mobile-theme',choice.value)}catch{}
 }
 apply(choices.find(choice=>choice.value===root.dataset.theme)||choices[0]);
 trigger.onclick=()=>setThemePickerOpen(popover.hidden);
 for(const choice of choices)choice.onclick=()=>apply(choice);
 document.addEventListener('click',event=>{
  if(!popover.hidden&&!bar.contains(event.target))setThemePickerOpen(false);
 });
 document.addEventListener('keydown',event=>{
  if(event.key==='Escape'&&!popover.hidden){event.preventDefault();setThemePickerOpen(false,true)}
 });
}
initMobileTheme();
let selected=null,turnId=null,cursor=null,eventStream,refreshTimer,reading=false,threadRows=[];
let opening=false,openSequence=0;const threadCache=new Map(),historyCursors=new Map(),renderNodes=new Map(),desktopThreads=new Set();let sending=false;const pendingApprovals=new Map();
const loadedThreads=new Set(),liveActivity=new Map();
const threadRevisions=new Map(),pendingOperations=new Map();let operationChecking=false,createBusy=false;
try{for(const operation of JSON.parse(sessionStorage.getItem('codex-mobile-operations')||'[]'))if(operation.id&&['send','create'].includes(operation.kind))pendingOperations.set(operation.id,operation)}catch{}
function persistOperations(){sessionStorage.setItem('codex-mobile-operations',JSON.stringify([...pendingOperations.values()]))}
function pendingSend(id=selected?.id){return [...pendingOperations.values()].find(o=>o.kind==='send'&&o.params.threadId===id)}
function pendingCreate(){return [...pendingOperations.values()].find(o=>o.kind==='create')}
function refreshOperationControls(){
 const operation=pendingSend();sending=!!operation;
 $('send').disabled=sending||opening||!remoteChatReady();$('send').textContent=operation?'确认中…':'发送';
 $('new').disabled=createBusy||!!pendingCreate()||!remoteChatReady();$('new').textContent=pendingCreate()?'正在确认新建…':'新建聊天';
 document.querySelectorAll('.workspace-new').forEach(b=>{b.disabled=createBusy||!!pendingCreate()||!remoteChatReady();b.textContent=pendingCreate()?'正在确认新建…':'＋ 新建会话'});
 if(operation)$('turnState').textContent='正在确认电脑是否收到，草稿已保留，请勿重复发送。';
 if(typeof updateTaskControls==='function')updateTaskControls();
}
async function readJsonResponse(response){
 if(response.status===401)throw Error('连接身份未通过，请确认手机 Tailscale 已连接到你的账号，再刷新本页。无需回电脑扫码。');
 const text=await response.text(),status='HTTP '+response.status;
 if(!text.trim())throw Error('连接请求收到空响应（'+status+'），请稍后检查连接。草稿会保留，请勿重复发送。');
 try{return JSON.parse(text)}catch{throw Error('连接响应不完整或格式无效（'+status+'），请稍后检查连接。草稿会保留，请勿重复发送。')}
}
async function operationRequest(path,body){const response=await fetch('/mobile-api/operations'+path,{method:body?'POST':'GET',headers:{...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store',signal:AbortSignal.timeout(12000)});const result=await readJsonResponse(response);if(!response.ok){const error=Error(result.error||'暂未取得操作回执（HTTP '+response.status+'）');error.definitive=!!body&&response.status===400;throw error;}return result}
function settleOperation(operation,receipt){
 if(!pendingOperations.has(operation.id))return receipt;
 if(receipt.id!==operation.id||!['succeeded','failed'].includes(receipt.status))return receipt;
 pendingOperations.delete(operation.id);persistOperations();
 if(receipt.status==='failed'){const message=(operation.kind==='send'?'发送失败，草稿已保留：':'创建失败：')+(receipt.error||'电脑未接受操作');if(operation.params.threadId===selected?.id)$('turnState').textContent=message;error(message)}
 else if(operation.kind==='create'){
  const thread=receipt.result?.thread;if(thread){threadCache.set(thread.id,thread);if(typeof rememberThreadSettings==='function')rememberThreadSettings(receipt.result);clearError();showChat(thread)}
 }else{
  const id=operation.params.threadId;desktopThreads.add(id);
  if(operation.draft!==undefined){const key='codex-draft:'+id;if((sessionStorage.getItem(key)||'').trim()===operation.draft)sessionStorage.removeItem(key);if(selected?.id===id&&$('prompt').value.trim()===operation.draft)$('prompt').value='';if(typeof attachmentsFor==='function'){const sent=new Set(operation.attachmentPaths||[]);draftAttachments.set(id,attachmentsFor(id).filter(file=>!sent.has(file.path)));if(selected?.id===id)renderAttachments()}}
  liveActivity.set(id,{running:true,baseTurnId:threadCache.get(id)?.turns?.at(-1)?.id,label:'正在思考中…'});
  if(selected?.id===id){$('turnState').textContent='已发送';updateActivity();scheduleRead();goLatest()}
 }
 refreshOperationControls();return receipt;
}
async function submitOperation(kind,params,details={}){
 const previous=kind==='send'?pendingSend(params.threadId):pendingCreate();if(previous)return {id:previous.id,status:'pending'};
 requireChatReady();const operation={id:crypto.randomUUID(),kind,params,...details};pendingOperations.set(operation.id,operation);
 try{persistOperations()}catch(e){pendingOperations.delete(operation.id);throw Error('无法保存操作凭据，请检查浏览器存储后重试。')}
 refreshOperationControls();
 try{return settleOperation(operation,await operationRequest('',{id:operation.id,kind,params}))}catch(e){if(e.definitive){pendingOperations.delete(operation.id);persistOperations();throw e;}return {id:operation.id,status:'pending'}}finally{refreshOperationControls()}
}
async function checkPendingOperations(){
 if(operationChecking||document.hidden||!privateAccess||!pendingOperations.size)return;operationChecking=true;
 try{await Promise.all([...pendingOperations.values()].map(async operation=>{try{let receipt=await operationRequest('?id='+encodeURIComponent(operation.id));if(receipt.status==='not_found')receipt=await operationRequest('',{id:operation.id,kind:operation.kind,params:operation.params});settleOperation(operation,receipt)}catch(e){if(e.definitive)settleOperation(operation,{id:operation.id,status:'failed',error:e.message})}}))}finally{operationChecking=false;refreshOperationControls()}
}
function pendingReceiptError(){const e=Error('正在确认电脑是否收到，内容已保留，请勿重复发送。');e.pendingOperation=true;return e}
let remoteConnectionHealth=null,connectionHealthPending=null,connectionHealthTimer,lastConnectionResume=-Infinity;
function remoteChatReady(){return remoteConnectionHealth?.ready===true}
function requireChatReady(){if(!remoteChatReady())throw Error(remoteConnectionHealth?.message||'正在检查电脑连接，请稍后重试；草稿会保留。')}
function applyConnectionHealth(health){
 remoteConnectionHealth=health;
 $('state').textContent=health.ready?'可聊天':health.code==='DESKTOP_RESTART_REQUIRED'?'需要电脑端恢复':health.code==='NETWORK_UNAVAILABLE'?'网络未连接':'聊天暂不可用';
 $('connectionNotice').hidden=health.ready;
 $('connectionTitle').textContent=health.code==='DESKTOP_RESTART_REQUIRED'?'需要在电脑端恢复连接':'聊天连接暂不可用';
 $('connectionMessage').textContent=health.message;
 refreshOperationControls();
 if(typeof updateTaskControls==='function')updateTaskControls();
}
function refreshConnectionHealth(restart=false){
 if(!privateAccess)return Promise.resolve();
 if(connectionHealthPending&&!restart)return connectionHealthPending.promise;
 clearTimeout(connectionHealthTimer);
 const previous=connectionHealthPending,check={controller:new AbortController()};
 connectionHealthPending=check;previous?.controller.abort();
 let timeout;
 const deadline=new Promise((_,reject)=>{
  timeout=setTimeout(()=>{
   reject(Error('health timed out'));
   check.controller.abort();
  },8000);
 });
 check.promise=(async()=>{
  try{
   // Bound both fetch and body parsing even if a suspended request ignores abort.
   const request=(async()=>{
    const response=await fetch('/mobile-api/health',{cache:'no-store',signal:check.controller.signal});
    if(response.status===401||response.status===403)return {ready:false,code:'AUTH_REQUIRED',message:'连接身份未通过，请确认手机 Tailscale 已连接到你的账号，再刷新本页。'};
    if(!response.ok)throw Error('health unavailable');
    const health=await response.json();if(health.schemaVersion!==1)throw Error('health contract unavailable');
    return health;
   })();
   const health=await Promise.race([request,deadline]);
   if(connectionHealthPending===check)applyConnectionHealth(health);
  }catch{if(connectionHealthPending===check)applyConnectionHealth({ready:false,code:'NETWORK_UNAVAILABLE',message:'暂时无法检查电脑连接，正在自动重试。请确认手机 Tailscale 和电脑网络在线。草稿会保留。'})}
 })().finally(()=>{
  clearTimeout(timeout);
  if(connectionHealthPending!==check)return;
  connectionHealthPending=null;
  connectionHealthTimer=setTimeout(()=>{if(!document.hidden)refreshConnectionHealth()},remoteChatReady()?10000:2500);
 });return check.promise;
}

function error(e){const text=e.message||String(e);delete $('error').dataset.historyThread;$('error').textContent=/active writer|thread-store conflict/i.test(text)?'电脑端占用此聊天，且应用消息接口未能完成发送。草稿已保留，请稍后重试。':text;$('error').hidden=false}
function clearError(){$('error').hidden=true;delete $('error').dataset.historyThread}
function historyError(id,e){if(selected?.id!==id)return;if(!$('error').hidden&&!$('error').dataset.historyThread)return;error(e);$('error').dataset.historyThread=id}
function clearHistoryError(id){if($('error').dataset.historyThread===id)clearError()}
function button(text,fn){const b=document.createElement('button');b.textContent=text;b.onclick=()=>Promise.resolve(fn()).catch(error);return b}
async function rpc(method,params={}){const id=crypto.randomUUID();const r=await bridge({type:'mcp-request',hostId:'local',request:{id,method,params}});const msg=(r.messages||[]).find(m=>m.type==='mcp-response'&&m.message?.id===id)?.message;if(!msg)throw Error('未收到 Codex 响应');if(msg.error)throw Error(msg.error.message||JSON.stringify(msg.error));return msg.result}
function threadActivityTime(t){return Number(t.recencyAt??t.updatedAt??t.createdAt??0)}
function recentThreads(rows){return [...rows].sort((a,b)=>threadActivityTime(b)-threadActivityTime(a)||String(a.id).localeCompare(String(b.id)))}
function renderList(){if(deferThreadListRender())return;threadRows=recentThreads(threadRows);renderPinnedThreads();const list=$('threads');list.replaceChildren();const rows=orderedThreadRows('threads',threadRows.filter(t=>!desktopThreadPins.has(t.id)));for(const t of rows)list.append(makeThreadRow(t));if(!rows.length)list.textContent=threadRows.length?'其余聊天会显示在这里。':'暂时没有聊天，可以新建一个。';$('more').hidden=!cursor;if(typeof renderWorkspaces==='function')renderWorkspaces()}

async function list(more=false){clearError();const r=await listThreads({limit:more?30:Math.max(30,threadRows.length),sortKey:'recency_at',...(more&&cursor?{cursor}:{} )});threadRows=more?threadRows.concat(r.data||[]):r.data||[];cursor=r.nextCursor;renderList()}
function threadDisplayTitle(t,fallback='新聊天'){

function approvalField(card,label,value,code=false){if(value===undefined||value===null||value==='')return;const field=document.createElement('div');field.className='approval-field';field.dataset.field=label;const name=document.createElement('span');name.textContent=label;const body=document.createElement(code?'pre':'div');body.className='approval-value';body.textContent=Array.isArray(value)?value.join('\n'):String(value);field.append(name,body);card.append(field)}
function permissionFields(card,permissions,prefix=''){const names={network:'网络访问',fileSystem:'文件访问',filesystem:'文件访问',read:'读取',write:'写入',readPaths:'可读取的路径',writePaths:'可写入的路径',allowedDomains:'允许访问的域名',domains:'访问域名',enabled:'启用',access:'访问范围',fullAccess:'完整访问',restricted:'受限访问'};for(const [key,value] of Object.entries(permissions||{})){const label=(prefix?prefix+' · ':'')+(names[key]||key);if(value&&typeof value==='object'&&!Array.isArray(value))permissionFields(card,value,label);else approvalField(card,label,typeof value==='boolean'?(value?'允许':'不允许'):value)}}
function approval(request){const key=String(request.id);if(pendingApprovals.has(key))return;const p=request.params||{},method=request.method,card=document.createElement('div');card.className='approval';pendingApprovals.set(key,{request,card});const titles={'item/commandExecution/requestApproval':'允许执行命令？','item/fileChange/requestApproval':'允许修改这些文件？','item/permissions/requestApproval':'允许申请的权限？','item/tool/requestUserInput':'需要你的选择','mcpServer/elicitation/request':'需要你补充信息'};const h=document.createElement('strong');h.className='approval-title';h.textContent=p.title||titles[method]||'需要你的确认';card._title=h.textContent;h.hidden=true;const source=document.createElement('span');source.className='approval-source';const thread=threadRows.find(t=>t.id===p.threadId);source.textContent=(key.startsWith('desktop:')?'电脑会话':'手机会话')+(thread?' · '+(thread.name||thread.preview?.slice(0,60)||'未命名聊天'):'');card.append(h,source);

const actions=document.createElement('div');actions.className='approval-actions';const inlineError=document.createElement('div');inlineError.className='approval-error';inlineError.setAttribute('role','alert');const respond=async result=>{const buttons=card.querySelectorAll('button');buttons.forEach(b=>b.disabled=true);inlineError.textContent='正在提交…';card.setAttribute('aria-busy','true');try{await approvalApi({id:request.id,result});pendingApprovals.delete(key);card.remove();updateApprovals();scheduleRead()}catch(e){inlineError.textContent=e.message||String(e)}finally{card.removeAttribute('aria-busy');buttons.forEach(b=>b.disabled=false)}};
function choice(label,result,primary=false){const b=button(label,()=>respond(result));if(primary)b.className='primary';actions.append(b)}
if(method==='item/permissions/requestApproval'){choice('允许本次', {permissions:p.permissions,scope:'turn'},true);choice('拒绝',{permissions:{},scope:'turn'})}
else if(method.endsWith('/requestApproval')){const offered=Array.isArray(p.availableDecisions)?p.availableDecisions:null;const supports=d=>!offered||offered.some(x=>typeof d==='string'?x===d:JSON.stringify(x)===JSON.stringify(d));if(supports('accept'))choice('允许本次',{decision:'accept'},true);const amendment=p.proposedExecpolicyAmendment;if(Array.isArray(amendment)&&amendment.length){const decision={acceptWithExecpolicyAmendment:{execpolicy_amendment:amendment}};if(supports(decision)){approvalField(card,'允许同类命令的范围',amendment.join(' '),true);choice('允许同类命令',{decision})}}for(const rule of p.proposedNetworkPolicyAmendments||[]){if(rule.action!=='allow')continue;const decision={applyNetworkPolicyAmendment:{network_policy_amendment:rule}};if(supports(decision)){approvalField(card,'允许访问的域名',rule.host);choice('允许此域名',{decision})}}if(offered?.includes('acceptForSession')||(!offered&&(p.networkApprovalContext||method==='item/fileChange/requestApproval'&&p.grantRoot)))choice('本会话允许',{decision:'acceptForSession'});choice('拒绝',{decision:offered?.includes('cancel')&&!offered.includes('decline')?'cancel':'decline'})}
else if(method==='item/tool/requestUserInput'){const inputs=[];for(const [index,q] of (p.questions||[]).entries()){const field=document.createElement('fieldset');field.className='approval-question';const legend=document.createElement('legend');legend.textContent=q.question;field.append(legend);const input=document.createElement('input');input.type=q.isSecret?'password':'text';input.placeholder=q.options?.length?'也可以填写其他回答':'请输入你的回答';input.setAttribute('aria-label',q.question);for(const option of q.options||[]){const label=document.createElement('label');label.className='approval-option';const radio=document.createElement('input');radio.type='radio';radio.name='approval-'+key+'-'+index;radio.value=option.label;radio.onchange=()=>{input.value=option.label};const text=document.createElement('span');text.textContent=option.label;if(option.description){const detail=document.createElement('small');detail.textContent=option.description;text.append(detail)}label.append(radio,text);field.append(label)}input.oninput=()=>field.querySelectorAll('input[type=radio]').forEach(r=>r.checked=r.value===input.value);field.append(input);card.append(field);inputs.push([q.id,input])}const submit=button('提交回答',()=>respond({answers:Object.fromEntries(inputs.map(([id,input])=>[id,{answers:[input.value]}]))}));submit.className='primary';actions.append(submit)}
else if(method==='mcpServer/elicitation/request'){const schema=p.requestedSchema||{},fields=[];for(const [name,property] of Object.entries(schema.properties||{})){const field=document.createElement('label');field.textContent=property.title||name;let input;if(property.type==='boolean'){input=document.createElement('select');for(const [value,label] of [['','请选择'],['true','是'],['false','否']])input.add(new Option(label,value))}else if(property.enum){input=document.createElement('select');input.add(new Option('请选择',''));property.enum.forEach((v,i)=>input.add(new Option(property.enumNames?.[i]||String(v),String(v))))}else{input=document.createElement('input');input.type=property.type==='number'||property.type==='integer'?'number':property.format==='password'?'password':'text'}input.setAttribute('aria-label',property.title||name);if(property.description){const hint=document.createElement('p');hint.className='approval-hint';hint.textContent=property.description;field.append(hint)}field.append(input);card.append(field);fields.push([name,property,input])}if(fields.length){const submit=button('提交',()=>{const content={};for(const [name,property,input] of fields){if(input.value===''){if((schema.required||[]).includes(name)){inlineError.textContent='请填写：'+(property.title||name);return}continue}content[name]=property.type==='boolean'?input.value==='true':property.type==='number'||property.type==='integer'?Number(input.value):property.enum?property.enum.find(v=>String(v)===input.value):input.value}return respond({action:'accept',content})});submit.className='primary';actions.append(submit)}else{const hint=document.createElement('p');hint.className='approval-hint';hint.textContent='请根据上方说明完成操作，再确认继续。';card.append(hint);choice('确认继续',{action:'accept',content:{}},true)}choice('拒绝',{action:'decline',content:null})}
else{const hint=document.createElement('p');hint.className='approval-hint';hint.textContent='此请求暂不支持快捷处理，请展开技术详情查看。';card.append(hint);const input=document.createElement('textarea');input.value='{}';input.setAttribute('aria-label','高级响应 JSON');const advanced=document.createElement('details');const label=document.createElement('summary');label.textContent='高级响应';advanced.append(label,input);card.append(advanced);actions.append(button('提交响应',()=>{try{return respond(JSON.parse(input.value))}catch{inlineError.textContent='响应格式有误，请填写有效 JSON。'}}))}
const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent='技术详情';const raw=document.createElement('pre');raw.textContent=JSON.stringify(p,null,2);details.append(summary,raw);card.append(details,inlineError,actions);$('approvals').append(card);updateApprovals();if(!$('approvalDialog').open)$('approvalDialog').showModal();}
function event(value){if(!value||typeof value!=='object')return;if(value.messages)for(const m of value.messages)event(m);if(value.result&&value.result!==value)event(value.result);if(value.type==='mcp-request'&&value.request)syncApprovals().catch(error);if(value.type==='mcp-notification'){recordActivity(value);if(value.method==='phone/approvalsChanged')syncApprovals().catch(error);if(value.method==='error')error(value.params?.error?.message||JSON.stringify(value.params));if(value.params?.threadId===selected?.id||value.method==='turn/completed')scheduleRead(value.method==='turn/completed'?100:600)}}
function connect(restart=false){
 if(!privateAccess||(!restart&&eventStream))return;
 eventStream?.close();
 const stream=new EventSource('/mobile-api/events');eventStream=stream;
 // EventSource handles reconnects; only the health endpoint decides readiness.
 stream.onopen=()=>{if(eventStream!==stream)return;refreshConnectionHealth();syncApprovals().catch(error);if(selected)readCurrent().catch(error);list().catch(error)};
 stream.onmessage=e=>{if(eventStream!==stream)return;try{event(JSON.parse(e.data))}catch(err){error(err)}};
 stream.onerror=()=>{if(eventStream===stream)refreshConnectionHealth()};
}
function resumeConnection(){if(document.hidden||!privateAccess)return;lastConnectionResume=performance.now();refreshConnectionHealth(true);connect(true);checkPendingOperations();if(selected)readCurrent().catch(error)}
function resumeOnForeground(){
 if(performance.now()-lastConnectionResume<500)return;
 resumeConnection();
}

document.addEventListener('visibilitychange',()=>{
