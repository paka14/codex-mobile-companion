name: Module checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm test
      - name: Check Windows launcher
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\test\windows-launcher.ps1
          .\test\windows-preflight.ps1
      - name: Build and smoke-test Windows portable ZIP
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = Get-Content packaging/node-win-x64.json -Raw | ConvertFrom-Json
          $node = Join-Path $env:RUNNER_TEMP $pin.archive
          Invoke-WebRequest -UseBasicParsing -Uri "https://nodejs.org/dist/$($pin.version)/$($pin.archive)" -OutFile $node
          $out = Join-Path $env:RUNNER_TEMP 'companion-portable'
          .\Build-WindowsPortable.ps1 -NodeArchive $node -OutputDirectory $out -Version '0.0.0-ci'
          .\test\windows-portable.ps1 -Archive (Join-Path $out 'codex-mobile-companion-0.0.0-ci-win-x64.zip')
